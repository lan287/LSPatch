# LSPatch 2.0 版本号定义

# 主版本号格式: MAJOR.MINOR.PATCH[-PRERELEASE]
# MAJOR: 架构重构、不兼容的 API 变更
# MINOR: 新功能、向后兼容的 API 新增
# PATCH: Bug 修复、性能优化

VERSION=2.0.0
VERSION_CODE=20000
VERSION_NAME=2.0.0-beta1

# API 版本（用于运行时兼容性检查）
API_VERSION=2

# 兼容的 Android 版本范围
MIN_SDK=26
TARGET_SDK=35
COMPILE_SDK=35

# 构建元数据
BUILD_TYPE=release
NDK_VERSION=26.3.11579264
CMAKE_VERSION=3.22.1
KOTLIN_VERSION=2.0.21
AGP_VERSION=8.7.3

# 依赖版本
LSPLANT_VERSION=2.1.0
DEX_PILOT_VERSION=1.3.0

# 签名信息（构建时注入，此处仅为模板）
# KEYSTORE_PATH=
# KEY_ALIAS=
# STORE_PASSWORD=
# KEY_PASSWORD=