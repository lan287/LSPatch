# LSPatch 2.0 — 多版本 CI 矩阵测试
#
# 测试矩阵说明：
# ┌─────────┬─────────┬─────────┬──────────────────────────────────────┐
# │ OS     │ SDK     │ Arch     │ 备注                                │
# ├─────────┼─────────┼─────────┼──────────────────────────────────────┤
# │ ubuntu │ 26 (8.0) │ x86_64  │ 最小兼容验证                       │
# │ ubuntu │ 28 (9)  │ x86_64  │ 隐藏 API 引入点                    │
# │ ubuntu │ 29 (10) │ x86_64  │ 分区存储 / AppComponentFactory     │
# │ ubuntu │ 30 (11) │ x86_64  │ userfaultfd GC                     │
# │ ubuntu │ 31 (12) │ x86_64  │ Splash Screen / ART 优化            │
# │ ubuntu │ 33 (13) │ x86_64  │ 推荐运行时                        │
# │ ubuntu │ 34 (14) │ x86_64  │ memfd / execmem 限制               │
# │ ubuntu │ 35 (15) │ x86_64  │ 最新 API 验证 (canary)             │
# │ windows│ 33 (13) │ x86_64  │ Windows 构建验证                    │
# │ macos  │ 34 (14) │ aarch64 │ ARM macOS / 真机测试               │
# └─────────┴─────────┴─────────┴──────────────────────────────────────┘
#
# 触发条件：
#   • push 到 main/master → 全矩阵 (10 job)
#   • Pull Request → 核心矩阵 (SDK 26/30/33/35)
#   • release/* 分支 → 全矩阵 + 签名校验
#
name: LSPatch 2.0 Compat CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_full_matrix:
        description: 'Run full SDK matrix (default: only key versions)'
        required: false
        default: 'true'

jobs:

  # ==================== 编译测试 ====================
  build:
    name: Build · SDK ${{ matrix.sdk }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 核心版本矩阵 — 覆盖所有 LSPatch 2.0 支持的 Android SDK
        sdk: [26, 28, 29, 30, 31, 33, 34, 35]
        include:
          # Windows 构建验证
          - os: windows-latest
            sdk: 33
          # ARM macOS 构建验证
          - os: macos-latest
            sdk: 34

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools: latest
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Grant execute permissions
        run: chmod +x gradlew
        if: runner.os != 'Windows'

      - name: Compile (SDK ${{ matrix.sdk }})
        run: ./gradlew :compat:assembleDebug :compat:assembleRelease -PvariantSdk=${{ matrix.sdk }} --no-daemon
        if: runner.os != 'Windows'
        shell: bash

      - name: Compile (Windows)
        run: .\gradlew.bat :compat:assembleDebug -PvariantSdk=${{ matrix.sdk }} --no-daemon
        if: runner.os == 'Windows'
        shell: powershell

      - name: Upload AAR outputs
        uses: actions/upload-artifact@v4
        with:
          name: compat-aar-sdk${{ matrix.sdk }}-${{ runner.os }}
          path: |
            compat/build/outputs/aar/
          retention-days: 7

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-sdk${{ matrix.sdk }}-${{ runner.os }}
          path: compat/build/reports/
          retention-days: 30

  # ==================== 单元测试 ====================
  test:
    name: Unit Tests · SDK ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        sdk: [26, 29, 33, 35]  # 关键版本：最小 / 10 / 13 / 最新

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Run unit tests
        run: ./gradlew :compat:testDebugUnitTest -PvariantSdk=${{ matrix.sdk }} --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-sdk${{ matrix.sdk }}
          path: compat/build/test-results/testDebugUnitTest/
          retention-days: 7

  # ==================== 仪器测试 ====================
  instrumentation:
    name: Instr. Tests · API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 29, 33, 34]
        target: [default, google_apis]
        arch: [x86_64]
        exclude:
          # Android 8.0 仅在 default AVD 上测试（google_apis 可能缺失）
          - api-level: 26
            target: google_apis

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Enable KVM (faster emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger
          sudo chmod 666 /dev/kvm
        shell: bash

      - name: Run Android emulator + test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect
          script: ./gradlew :compat:connectedCheck --no-daemon -PvariantSdk=${{ matrix.api-level }}

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instr-reports-api${{ matrix.api-level }}-${{ matrix.target }}
          path: compat/build/reports/androidTests/connected/
          retention-days: 7

  # ==================== ROM 兼容性测试 ====================
  rom-compat:
    name: ROM Compat · ${{ matrix.rom }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rom: [xiaomi, huawei, samsung, oppo, vivo, stock]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Run ROM-specific test suites
        run: ./gradlew :compat:testDebugUnitTest --tests "*RomTest*" --tests "*RomAdapter*" --tests "*RomDetector*" -PtestRom=${{ matrix.rom }} --no-daemon

      - name: Upload ROM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rom-compat-reports-${{ matrix.rom }}
          path: compat/build/test-results/
          retention-days: 7

  # ==================== 代码质量 ====================
  lint:
    name: Lint · SDK 35
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Run Android Lint
        run: ./gradlew :compat:lint --no-daemon

      - name: Upload lint results
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-sdk35
          path: compat/build/reports/lint-results*.html
          retention-days: 30

  # ==================== 合并报告 ====================
  report:
    name: Final Report
    runs-on: ubuntu-latest
    needs: [build, test, instrumentation, rom-compat, lint]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/

      - name: Generate compatibility summary
        run: |
          echo "# LSPatch 2.0 Compatibility Test Summary" > summary.md
          echo "" >> summary.md
          echo "- Build: ${{ needs.build.result }}" >> summary.md
          echo "- Unit tests: ${{ needs.test.result }}" >> summary.md
          echo "- Instrumentation tests: ${{ needs.instrumentation.result }}" >> summary.md
          echo "- ROM compatibility: ${{ needs.rom-compat.result }}" >> summary.md
          echo "- Lint: ${{ needs.lint.result }}" >> summary.md
          echo "" >> summary.md
          echo "All artifacts available from CI run." >> summary.md

      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-summary
          path: summary.md
          retention-days: 90
