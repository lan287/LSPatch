# LSPatch 2.0 Compat Module — Gradle 全局属性

# AndroidX 和 Jetpack 配置
android.useAndroidX=true
android.enableJetifier=false

# Kotlin
kotlin.code.style=official
kotlin.caching.enabled=true

# Android Gradle Plugin 性能优化
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configureondemand=true

# R8 优化级别
android.enableR8.fullMode=true
android.enableR8=true

# 非传递性 R 类：减少包体积和编译时间
android.nonTransitiveRClass=true

# 启用 AAR 元数据生成（供 LSPatch 框架自动识别）
android.defaults.buildfeatures.buildconfig=true
